schema_version: 1
component:
  id: living-cryptography
  name: Living Cryptography
  layer: SECURITY
  artifact_type: research-proposal
  problem: Explore authentication and cryptographic mechanisms that can adapt after authentication failure.
  scope:
    - Public research direction for adaptive authentication, uPOW and encryption.
    - Documentation of intended security properties and open questions.
    - "Encryption as the skin of the network: data leaving a device circulates fragmented and encrypted, unreadable to the operator of the machine that holds it."
    - Compartmentalisation, detection of anomalous behaviour and fault tolerance under an explicit threat model.
    - "The first access layer of the main network and of the public interaction and testing network, working as a distributed secure channel."
    - "A first sketch of uPOW: functions waiting at connection ports, a key per request and a larger computation to receive the answer."
    - "Validation by a few nearby nodes without a direct connection, and violations traced back to the requesting UID."
  non_scope:
    - Audited cryptographic software.
    - A production authentication service or completed threat model.
  dependencies:
    - dk-network
    - uid
    - osdk
  implementation:
    level: none
    scope: The repository contains a research proposal; no safe production implementation is published.
    evidence:
      - type: document
        ref: docs/README.md
  risks:
    - Unspecified cryptography must not be treated as secure or production-ready.
    - Metaphorical descriptions can obscure concrete threat and trust assumptions.
  contributions:
    availability: open
    entrypoint: https://github.com/draykerdk/living-cryptography/issues
  source_of_truth:
    repository: https://github.com/draykerdk/living-cryptography
    path: docs/README.md
  last_reviewed: "2026-10-19"
